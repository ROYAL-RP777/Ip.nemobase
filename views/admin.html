<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP.NEMOBASE - Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { font-size: 24px; color: #38bdf8; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #334155; color: #38bdf8; font-size: 14px; text-transform: uppercase; }
        tr:hover { background: #24334d; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; }
        .back-btn:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← მთავარზე დაბრუნება</a>
        <h1>⚙️ ადმინ პანელი - ლოგები</h1>
        <table>
            <thead>
                <tr>
                    <th>დრო</th>
                    <th>IP მისამართი</th>
                    <th>ქვეყანა / რეგიონი</th>
                </tr>
            </thead>
            <tbody id="logs-body">
                <tr><td colspan="3">იტვირთება...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        fetch('/api/logs')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('logs-body');
                tbody.innerHTML = '';
                if(data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3">ჩანაწერები არ არის</td></tr>';
                    return;
                }
                data.reverse().forEach(log => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${new Date(log.timestamp).toLocaleString('ka-GE')}</td>
                        <td><strong>${log.ip}</strong></td>
                        <td>${log.region}</td>
                    `;
                    tbody.appendChild(row);
                });
            });
    </script>
</body>
</html>
