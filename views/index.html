<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP.NEMOBASE - თქვენი IP მისამართი</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1e293b; padding: 40px; border-radius: 16px; border: 1px solid #334155; text-align: center; max-width: 480px; width: 100%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        h1 { font-size: 24px; color: #38bdf8; margin-bottom: 24px; }
        .info-box { background: #0f172a; padding: 16px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #1e293b; }
        .label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .value { font-size: 20px; font-weight: bold; color: #f1f5f9; }
        .admin-link { margin-top: 20px; display: inline-block; color: #64748b; text-decoration: none; font-size: 14px; }
        .admin-link:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>ip.nemobase</h1>
        <div class="info-box">
            <div class="label">თქვენი IP მისამართი</div>
            <div class="value" id="ip">იტვირთება...</div>
        </div>
        <div class="info-box">
            <div class="label">ქვეყანა / რეგიონი</div>
            <div class="value" id="region">იტვირთება...</div>
        </div>
        <a href="/admin" class="admin-link">⚙️ ადმინ პანელი</a>
    </div>

    <script>
        fetch('/api/my-info')
            .then(res => res.json())
            .then(data => {
                document.getElementById('ip').innerText = data.ip;
                document.getElementById('region').innerText = data.region;
            });
    </script>
</body>
</html>
